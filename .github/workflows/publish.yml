name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # No NODE_AUTH_TOKEN: npm publish authenticates via the GitHub Actions
      # OIDC token, validated against the trusted publishing configuration
      # configured for this repository and this workflow file.
      - run: npm publish
